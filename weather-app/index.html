<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" id="autocompleteInput" placeholder="enter city name" spellcheck="false">
            <button><img src="images/search.png" alt="search icon"></button>
        </div>
        <p class="error">City not found. Please check the name and try again.</p>

        <div class="weather">
            <img src="images/thermometer.png" alt="weather icon" class="weather-icon">
            <h1 class="temp">~</h1>
            <h2 class="city">No city selected</h2><br>
            <img src="" alt="City Image" class="city-image">

            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="humidity icon">
                    <div>
                        <p class="humidity">~%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="wind icon">
                    <div>
                        <p class="wind">~ km/h</p>
                        <p>Wind speed</p>
                    </div>
                </div>
            </div>
            <button class="favorite-btn"><img src="images/heart.png" alt="add to favorites" height="50"></button>
            <div class="favorites">
                <h3>Favorites</h3>
                <ul class="favorites-list"></ul>
            </div>
        </div>

        <div class="forecast-btn">
            <button onclick="showFiveDayForecast()">View 5-Day Forecast</button>
        </div>

        <div id="five-day-forecast" class="weather-forecast"></div>
    </div>

    <!-- config.js holds the API keys and is not committed (see README) -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
